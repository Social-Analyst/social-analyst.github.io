<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Analyst — Who follows you back?</title>
<meta name="description" content="See your Instagram non-followers, fans, and mutuals. Just enter a public username.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0b0b0e;--card:#16161b;--border:#2a2a31;--muted:#8a8a93;--fg:#f2f2f5;--p:#e1306c;--p2:#a259e1}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:80px 24px 60px;text-align:center}
h1{font-size:clamp(36px,7vw,64px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
h1 span{background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:18px;max-width:520px;margin:16px auto 36px}
form{display:flex;gap:8px;max-width:480px;margin:0 auto}
input{flex:1;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--fg);font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--p)}
button{padding:14px 22px;background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:wait}
.note{color:var(--muted);font-size:12px;margin-top:14px}
#result{margin-top:40px;text-align:left;display:none}
.status{padding:24px;background:var(--card);border:1px solid var(--border);border-radius:16px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:14px;border-bottom:2px solid transparent}
.tab.active{color:var(--fg);border-bottom-color:var(--p)}
.list{max-height:400px;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px}
.row{display:flex;justify-content:space-between;padding:12px 16px;border-radius:8px;font-size:14px;align-items:center;margin-bottom:4px}
.row:hover{background:var(--bg)}
.row .user-meta{display:flex;flex-direction:column}
.row .handle{font-weight:600;color:var(--fg)}
.row .full{color:var(--muted);font-size:12px;margin-top:2px}
.row .app-btn{background:var(--p);color:#fff;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.err{color:#ff6b6b;padding:16px;background:rgba(255,107,107,.1);border-radius:12px;border:1px solid rgba(255,107,107,.3)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Know who actually <span>follows you back</span></h1>
  <p class="sub">Enter any public Instagram username. Our network of bot workers scans the account and shows your non-followers, fans, and mutuals.</p>
  <form id="f">
    <input id="u" required placeholder="instagram username (no @)" autocomplete="off" pattern="[A-Za-z0-9._]{1,30}">
    <button id="b" type="submit">Analyze</button>
  </form>
  <p class="note">Free · no login · public accounts only (or accounts our bot follows)</p>
  <section id="result"></section>
</main>
<footer>© Social Analyst · Not affiliated with Instagram or Meta.</footer>

<script>
  // ==========================================
  // 🔑 CONFIGURATION SECTION (FILL THESE OUT MANUALLY)
  // ==========================================
  const SUPABASE_URL = "https://cqwtcectvjfeqskpakmt.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxd3RjZWN0dmpmZXFza3Bha210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzkwNjYsImV4cCI6MjEwNzA1NTA2Nn0.FmaGagCsJp0x-nzIFUmhsYCTSZTjvYw6V1qnCD71naI"; 
  // ==========================================

  // Global UI Targeting Bindings
  const \$ = (id) => document.getElementById(id);
  const result = \$("result");

  // Global HTML Sanitization Core Function
  function escapeHtml(s) { 
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"'"}[c])); 
  }

  \$("f").addEventListener("submit", async (e) => {
    e.preventDefault(); // Lock the HTML form to prevent automated page reloads
    const username = \$("u").value.trim().replace(/^@/, "").toLowerCase();
    \$("b").disabled = true;
    result.style.display = "block";
    result.innerHTML = `<div class="status"><span class="spin"></span> Dropping request into bot queue...</div>`;
    
    try {
      // Send the request directly to the Supabase REST pipeline
      const r = await fetch(`${SUPABASE_URL}/rest/v1/jobs`, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON,
          "Authorization": `Bearer ${SUPABASE_ANON}`,
          "Prefer": "return=representation"
        },
        body: JSON.stringify({ username: username, status: 'pending' }),
      });
      
      const resData = await r.json();
      const job = Array.isArray(resData) ? resData[0] : resData;
      
      if (!r.ok || !job?.id) throw new Error("Could not log job inside the database queue container.");
      
      await poll(job.id, username);
    } catch (err) {
      result.innerHTML = `<div class="err">⚠️ Connection Blocked: ${escapeHtml(err.message)}</div>`;
    } finally { 
      \$("b").disabled = false; 
    }
  });

  async function poll(id, username) {
    const start = Date.now();
    let attempt = 0;
    while (Date.now() - start < 5 * 60_000) {
      attempt++;
      result.innerHTML = `<div class="status"><span class="spin"></span> Bot network running analytics loop on @${escapeHtml(username)}… (${Math.round((Date.now() - start) / 1000)}s)</div>`;
      
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/jobs?id=eq.${id}&select=status,result,error`, {
          headers: { "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}` },
        });
        const rows = await r.json();
        const job = Array.isArray(rows) ? rows[0] : rows;
        
        if (job?.status === "done" && job?.result) return render(job.result);
        if (job?.status === "failed") {
          result.innerHTML = `<div class="err">Scraper Exception: ${escapeHtml(job.error || "unknown error")}</div>`;
          return;
        }
      } catch (e) {
        console.warn("Retrying database connection check loop...");
      }
      await new Promise((r) => setTimeout(r, attempt < 5 ? 2000 : 4000));
    }
    result.innerHTML = `<div class="err">Timed out waiting for the cloud bot worker. Check Render terminal dashboard logs.</div>`;
  }

  function render(data) {
    const s = data.summary;
    const lists = {
      non_followers: data.non_followers || [],
      fans: data.fans || [],
      mutuals: data.mutuals || [],
    };
    
    result.innerHTML = `
      <div class="summary">
        <div class="stat"><div class="n">${s.followers || 0}</div><div class="l">Followers</div></div>
        <div class="stat"><div class="n">${s.following || 0}</div><div class="l">Following</div></div>
        <div class="stat"><div class="n">${s.non_followers || 0}</div><div class="l">Don't follow back</div></div>
        <div class="stat"><div class="n">${s.fans || 0}</div><div class="l">Fans</div></div>
        <div class="stat"><div class="n">${s.mutuals || 0}</div><div class="l">Mutuals</div></div>
      </div>
      <div class="tabs">
        <button class="tab active" id="t-non" onclick="switchTab('non')">Non-followers (${s.non_followers || 0})</button>
        <button class="tab" id="t-fans" onclick="switchTab('fans')">Fans (${s.fans || 0})</button>
        <button class="tab" id="t-mut" onclick="switchTab('mutuals')">Mutuals (${s.mutuals || 0})</button>
      </div>
      <div id="list" class="list"></div>
    `;
    
    window.currentLists = lists;
    switchTab('non');
  }

  window.switchTab = function(k) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if(k === 'non') document.getElementById('t-non').classList.add('active');
    if(k === 'fans') document.getElementById('t-fans').classList.add('active');
    if(k === 'mutuals') document.getElementById('t-mut').classList.add('active');

    const listKey = k === 'non' ? 'non_followers' : k === 'fans' ? 'fans' : 'mutuals';
    const items = window.currentLists[listKey];
    
    \$("list").innerHTML = items.map((u) =>
      `<div class="row">
        <div class="user-meta">
          <span class="handle">@${escapeHtml(u.username)}</span>
          <span class="full">${escapeHtml(u.full_name || "Instagram Profile")}</span>
        </div>
        <!-- 📱 MOBILE DEEP-LINK APP ROUTER ROUTE -->
        <a href="instagram://user?username=${escapeHtml(u.username)}" class="app-btn">View App ↗</a>
      </div>`
    ).join("") || `<div class="row"><span class="full">Empty array list context.</span></div>`;
  }
</script>
</body>
</html>
