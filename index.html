<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Analyst — Who follows you back?</title>
<meta name="description" content="See your Instagram non-followers, fans, and mutuals. Just enter a public username.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0b0b0e;--card:#16161b;--border:#2a2a31;--muted:#8a8a93;--fg:#f2f2f5;--p:#e1306c;--p2:#a259e1}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:80px 24px 60px;text-align:center}
h1{font-size:clamp(36px,7vw,64px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
h1 span{background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:18px;max-width:520px;margin:16px auto 36px}
form{display:flex;gap:8px;max-width:480px;margin:0 auto}
input{flex:1;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--fg);font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--p)}
button{padding:14px 22px;background:linear-gradient(135deg,var(--p),var(--p2));border:0;border-radius:12px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:wait}
.note{color:var(--muted);font-size:12px;margin-top:14px}
.tips{display:flex;flex-direction:column;gap:6px;max-width:480px;margin:18px auto 0;text-align:left}
.tip{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.45}
.tip-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.tip strong{color:var(--fg);font-weight:500}
#result{margin-top:40px;text-align:left;display:none}
.status{padding:24px;background:var(--card);border:1px solid var(--border);border-radius:16px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .n{font-size:28px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:14px;border-bottom:2px solid transparent}
.tab.active{color:var(--fg);border-bottom-color:var(--p)}
.list{max-height:400px;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;font-size:14px;text-decoration:none;color:var(--fg);transition:background .15s}
.row:hover{background:var(--bg)}
.row:hover .row-arrow{opacity:1}
.row-left{display:flex;flex-direction:column;gap:2px}
.row-handle{color:var(--fg);font-weight:500}
.row-name{color:var(--muted);font-size:12px}
.row-arrow{opacity:0;color:var(--muted);font-size:13px;transition:opacity .15s;flex-shrink:0}
.err{color:#ff6b6b;padding:16px;background:rgba(255,107,107,.1);border-radius:12px;border:1px solid rgba(255,107,107,.3)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Know who actually <span>follows you back</span></h1>
  <p class="sub">Enter any public Instagram username. Our official page scans the account and shows your non-followers, fans, and mutuals.</p>
  <form id="f">
    <input id="u" required placeholder="instagram username (no @)" autocomplete="off" pattern="[A-Za-z0-9._]{1,30}">
    <button id="b" type="submit">Analyze</button>
  </form>
  <p class="note">Free · no login · public accounts only (or accounts our official page follows)</p>
  <div id="tips" class="tips"></div>
  <section id="result"></section>
</main>
<footer>© Social Analyst · Not affiliated with Instagram or Meta.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
